name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  self-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CLI dependencies
        run: brew install fzf jq ripgrep

      - name: Run self-test
        run: make test
